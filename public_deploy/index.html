<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jessie Mitchell &bull; Contact Card</title>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: rgba(26, 33, 48, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --text: #ffffff;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Ambient card glow */
    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 32px 24px 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verified-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    /* Quick Action Round Buttons */
    .quick-actions {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 22px;
    }

    .action-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .action-btn:hover, .action-btn:active {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .action-btn span.icon {
      font-size: 1.25rem;
    }

    /* Details Rows */
    .details-list {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 16px;
      text-align: left;
      margin-bottom: 24px;
      font-size: 0.88rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .detail-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-item:first-child {
      padding-top: 0;
    }

    .label {
      color: var(--subtext);
      font-size: 0.78rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .val {
      color: #f8fafc;
      font-weight: 500;
      word-break: break-all;
    }

    a.val {
      color: #60a5fa;
      text-decoration: none;
    }

    /* Primary Save Button */
    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-save:hover, .btn-save:active {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.5);
    }

    .footer {
      margin-top: 18px;
      font-size: 0.75rem;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <div class="card">
    <div class="avatar" id="avatarDisplay">JM</div>

    <h1>Jessie Mitchell</h1>
    <p class="subtitle">
      <span class="verified-dot"></span>
      Personal Contact Card
    </p>

    <div class="quick-actions">
      <a class="action-btn" href="tel:+12568224733">
        <span class="icon">📞</span>
        <span>Call</span>
      </a>
      <a class="action-btn" href="sms:+12568224733">
        <span class="icon">💬</span>
        <span>Text</span>
      </a>
      <a class="action-btn" href="mailto:jessiwayne430@gmail.com">
        <span class="icon">✉️</span>
        <span>Email</span>
      </a>
    </div>

    <div class="details-list">
      <div class="detail-item">
        <span class="label">Mobile</span>
        <a class="val" href="tel:+12568224733">(256) 822-4733</a>
      </div>
      <div class="detail-item">
        <span class="label">Email</span>
        <a class="val" href="mailto:jessiwayne430@gmail.com">jessiwayne430@gmail.com</a>
      </div>
      <div class="detail-item">
        <span class="label">Birthday</span>
        <span class="val">April 30</span>
      </div>
    </div>

    <!-- Primary Action: Native 1-Tap Directory Sync (Completely Anonymous) -->
    <a class="btn-save" id="btnSyncAll" href="presets/jessie_mitchell_birthdays.ics">
      <span>📥</span> Save Contact to Phone
    </a>

    <!-- Secondary Action: Direct Clean vCard Download -->
    <a id="btnSaveVcf" href="presets/jessie_mitchell_clean.vcf" download="Jessie_Mitchell.vcf" style="margin-top: 12px; font-size: 0.8rem; color: #94a3b8; text-decoration: underline; cursor: pointer; display: inline-block;">
      Save Contact (.vcf) Only
    </a>

    <div class="footer" style="margin-top: 14px;">
      <span>📲 Tap &bull; Compatible with Apple &amp; Android</span>
    </div>
  </div>

  <script>
    // Intelligent handler for iOS webcal:// and Android .ics
    const syncBtn = document.getElementById("btnSyncAll");
    
    // Compute dynamic webcal:// URL for seamless 1-tap iOS subscription
    const baseUrl = window.location.href.split('#')[0].split('?')[0].replace(/\/card\.html|\/index\.html|\/$/, '');
    const icsPath = baseUrl + "/presets/jessie_mitchell_birthdays.ics";
    const webcalPath = icsPath.replace(/^https?:\/\//i, "webcal://");

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      syncBtn.href = webcalPath;
    } else {
      syncBtn.href = icsPath;
    }

    syncBtn.addEventListener("click", function(e) {
      // Also trigger the clean personal contact card download so phone gets Jessie's number
      setTimeout(() => {
        const vcfLink = document.createElement("a");
        vcfLink.href = "presets/jessie_mitchell_clean.vcf";
        vcfLink.download = "Jessie_Mitchell.vcf";
        document.body.appendChild(vcfLink);
        vcfLink.click();
        document.body.removeChild(vcfLink);
      }, 600);
    });
  </script>
</body>
</html>
