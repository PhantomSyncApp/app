<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pranker Mission Control &bull; PhantomSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.09);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.3);
      --purple: #8b5cf6;
      --rose: #f43f5e;
      --green: #10b981;
      --amber: #f59e0b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #151d38 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px 16px;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 24px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-weight: 900;
      font-size: 1.2rem;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .nav-links a {
      color: var(--subtext);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      margin-left: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: white;
    }

    .header-box {
      margin-bottom: 28px;
    }

    .header-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header-sub {
      color: var(--subtext);
      font-size: 0.9rem;
    }

    /* Track manual input card */
    .track-input-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .track-input {
      flex: 1;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
    }

    .btn-track {
      background: var(--cyan);
      color: #080c14;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-track:hover {
      background: #22d3ee;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    /* Campaign Card */
    .campaign-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .campaign-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .target-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: white;
    }

    .cid-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--subtext);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .status-decoy {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .status-live {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .status-killed {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
    }

    @media (max-width: 550px) {
      .telemetry-grid { grid-template-columns: 1fr; }
    }

    .telem-label {
      font-size: 0.72rem;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .telem-val {
      font-size: 0.95rem;
      font-weight: 800;
      color: white;
    }

    /* Actions */
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: white;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-action-primary {
      background: rgba(6, 182, 212, 0.15);
      border-color: rgba(6, 182, 212, 0.4);
      color: #67e8f9;
    }

    .theme-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .theme-pill:hover {
      background: rgba(255,255,255,0.12);
      color: white;
      border-color: rgba(255,255,255,0.3);
    }
    .theme-pill.active {
      background: rgba(37,99,235,0.3);
      border-color: #3b82f6;
      color: #93c5fd;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(59,130,246,0.3);
    }

    .sub-device-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .btn-action-primary:hover {
      background: rgba(6, 182, 212, 0.25);
    }

    .btn-kill {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.35);
      color: #fb7185;
      margin-left: auto;
    }

    .btn-kill:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    /* Reaction Notes Area */
    .notes-box {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .notes-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--subtext);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .notes-textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 8px;
      resize: vertical;
      min-height: 50px;
      outline: none;
    }

    .notes-textarea:focus {
      border-color: var(--cyan);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav>
      <a href="index.html" class="brand-logo">
        <div class="brand-dot"></div>
        <span>PhantomSync</span>
      </a>
      <div class="nav-links">
        <a href="phantomsync_studio.html">⚡ New Campaign</a>
        <a href="index.html">Home</a>
      </div>
    </nav>

    <div class="header-box">
      <h1 class="header-title">🕵️ Pranker Mission Control</h1>
      <p class="header-sub">Track your active slow-burn victims, monitor device telemetry, toggle Trojan decoys, and manage remote kill switches.</p>
    </div>

    <!-- Manual ID Tracker -->
    <div class="track-input-card">
      <input type="text" id="inputTrackCid" class="track-input" placeholder="Paste a Campaign ID to track (e.g. ps_2qo5mu6k)...">
      <button type="button" id="btnTrackCid" class="btn-track">Track Campaign</button>
    </div>



    <!-- Campaign Feed Container -->
    <div id="campaignList">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <script>
    const CLOUDFLARE_WORKER_URL = "https://phantomsync-api.sys-directory.workers.dev";

    const VICTIM_0_DEFAULT = {
      id: "c_demo_victim_0",
      name: "Jared Wilson (Victim 0)",
      decoyCalName: "Mobile Directory Sync",
      decoyTitle: "📱 Enterprise Directory Verification",
      createdAt: 1730000000000
    };

    // Load campaigns from local storage or URL query (Jared Wilson / Victim 0 seeded by default)
    function getStoredCampaigns() {
      try {
        const raw = localStorage.getItem("phantom_campaigns");
        const untracked = JSON.parse(localStorage.getItem("phantom_untracked") || "[]");
        let list = raw !== null ? JSON.parse(raw) : null;

        if (list === null) {
          // First visit: Seed Jared Wilson (Victim 0) by default
          list = [VICTIM_0_DEFAULT];
          saveStoredCampaigns(list);
        } else if (!untracked.includes("c_demo_victim_0") && !list.some(c => c.id === "c_demo_victim_0")) {
          // If not explicitly untracked, keep Jared present
          list.unshift(VICTIM_0_DEFAULT);
          saveStoredCampaigns(list);
        }
        return list;
      } catch (e) {
        return [VICTIM_0_DEFAULT];
      }
    }

    function saveStoredCampaigns(camps) {
      localStorage.setItem("phantom_campaigns", JSON.stringify(camps.slice(0, 30)));
    }

    async function fetchCampaignStatus(cid) {
      const cleanUrl = CLOUDFLARE_WORKER_URL.replace(/\/+$/, "");
      const res = await fetch(`${cleanUrl}/api/campaigns/${cid}/status`);
      if (!res.ok) return null;
      return await res.json();
    }

    async function renderDashboard() {
      const container = document.getElementById("campaignList");
      container.innerHTML = "";

      const campaigns = getStoredCampaigns();

      // Check if URL has ?cid=
      const urlParams = new URLSearchParams(window.location.search);
      const urlCid = urlParams.get("cid");
      if (urlCid && !campaigns.some(c => c.id === urlCid)) {
        const name = urlCid === "c_demo_victim_0" ? "Jared Wilson (Victim 0)" : "Target";
        campaigns.unshift({ id: urlCid, name: name, createdAt: Date.now() });
        saveStoredCampaigns(campaigns);
      }

      if (!campaigns.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎯</div>
            <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:6px;">No Active Campaigns Tracked</h3>
            <p style="color:var(--subtext); font-size:0.85rem; margin-bottom:18px;">
              You haven't armed any slow-burn campaigns from this browser yet.
            </p>
            <a href="phantomsync_studio.html" class="btn-track" style="text-decoration:none; display:inline-block;">
              ⚡ Launch a Campaign in Studio
            </a>
          </div>
        `;
        return;
      }

      for (const camp of campaigns) {
        const card = document.createElement("div");
        card.className = "campaign-card";
        card.id = `card-${camp.id}`;

        card.innerHTML = `
          <div class="campaign-header">
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <div class="target-name" id="targetName-${camp.id}">${camp.name || "Target"}</div>
                <button type="button" onclick="renameCampaign('${camp.id}')" style="background:transparent; border:none; color:#64748b; cursor:pointer; font-size:0.8rem; padding:2px;" title="Rename Target">✏️</button>
              </div>
              <div style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
                <div class="cid-pill">ID: ${camp.id}</div>
                <div id="heartbeatBadge-${camp.id}" style="font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.08); color:#94a3b8; display:inline-flex; align-items:center; gap:4px;">
                  ⚪ Checking Connection...
                </div>
              </div>
            </div>
            <div id="statusBadge-${camp.id}" class="status-badge status-decoy">
              ⏳ Fetching Telemetry...
            </div>
          </div>

          <!-- Live Subscription Heartbeat Alert Banner -->
          <div id="subAlert-${camp.id}" style="display:none; margin-bottom:12px; padding:10px 14px; border-radius:10px; font-size:0.78rem; font-weight:600; line-height:1.45;"></div>

          <div class="telemetry-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
            <div>
              <div class="telem-label">Subscriber Device</div>
              <div class="telem-val" id="telemDevice-${camp.id}" style="font-size:0.82rem; color:#38bdf8;">Waiting...</div>
            </div>
            <div>
              <div class="telem-label">Total Sync Checks</div>
              <div class="telem-val" id="telemSyncs-${camp.id}">0</div>
            </div>
            <div>
              <div class="telem-label">Last Device Check</div>
              <div class="telem-val" id="telemLastCheck-${camp.id}" style="font-size:0.82rem;">Never</div>
            </div>
            <div>
              <div class="telem-label">Next Target Strike</div>
              <div class="telem-val" id="telemNextStrike-${camp.id}" style="font-size:0.82rem; color:#fde047;">Calculating...</div>
            </div>
          </div>

          <!-- Rolling Drip Horizon Box -->
          <div id="dripBox-${camp.id}" style="margin: 10px 0; padding: 10px 12px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.25); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <div style="font-size: 0.78rem;" id="dripSummary-${camp.id}">
              💧 <strong>Anti-Spoil Drip:</strong> Calculating stealth horizon...
            </div>
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-size:0.68rem; color:var(--subtext); margin-right:2px;">Horizon:</span>
              <button type="button" class="btn-action" style="padding:3px 8px; font-size:0.7rem;" onclick="setDripDays('${camp.id}', 7, this)">7d</button>
              <button type="button" class="btn-action" style="padding:3px 8px; font-size:0.7rem;" onclick="setDripDays('${camp.id}', 14, this)">14d</button>
              <button type="button" class="btn-action" style="padding:3px 8px; font-size:0.7rem;" onclick="setDripDays('${camp.id}', 21, this)">21d</button>
              <button type="button" class="btn-action" style="padding:3px 8px; font-size:0.7rem;" onclick="setDripDays('${camp.id}', 30, this)">30d</button>
              <button type="button" class="btn-action" style="padding:3px 8px; font-size:0.7rem;" onclick="setDripDays('${camp.id}', 0, this)">All</button>
            </div>
          </div>

          <!-- Multi-Subscriber Breakdown Container (Hidden by default, shown when multiple devices or clicked) -->
          <div id="subscriberList-${camp.id}" style="display:none; margin: 10px 0; background:rgba(0,0,0,0.4); border:1px solid rgba(56,189,248,0.25); border-radius:10px; padding:12px 14px;">
            <div style="font-size:0.78rem; font-weight:800; color:#38bdf8; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <span style="display:flex; align-items:center; gap:6px;">👥 <span>Target Subscriber Devices</span></span>
              <span id="subscriberCountBadge-${camp.id}" style="font-size:0.7rem; background:rgba(6,182,212,0.18); color:#67e8f9; padding:2px 8px; border-radius:999px;">0 Devices</span>
            </div>
            <div id="subscriberRows-${camp.id}" style="display:flex; flex-direction:column; gap:6px;">
              <div style="color:#94a3b8; font-size:0.75rem; text-align:center; padding:8px;">Waiting for targets to subscribe...</div>
            </div>
          </div>

          <div class="card-actions">
            <button class="btn-action" style="background:linear-gradient(135deg, #2563eb, #1d4ed8); border-color:#3b82f6; color:white; font-weight:800; box-shadow:0 0 15px rgba(37,99,235,0.4);" onclick="toggleInviteDrawer('${camp.id}', this)" id="btnInvite-${camp.id}">
              ✉️ Invite & Share Decoy
            </button>
            <a class="btn-action" href="join.html?cid=${camp.id}" target="_blank" style="color:#93c5fd; border-color:rgba(59,130,246,0.4); font-weight:700;">
              🛡️ Open Trojan Portal
            </a>
            <button class="btn-action" onclick="copyJoinUrl('${camp.id}', this)" style="color:#60a5fa; border-color:rgba(59,130,246,0.4); font-weight:700;">
              📋 Copy Trojan SMS Link
            </button>
            <button class="btn-action" onclick="copyFeedUrl('${camp.id}', this)">
              📋 Copy WebCal Feed
            </button>
            <a class="btn-action" href="https://calendar.google.com/calendar/render?cid=${encodeURIComponent('webcal://' + new URL(CLOUDFLARE_WORKER_URL).host + '/cal/' + camp.id + '.ics')}" target="_blank">
              🤖 Google Cal
            </a>
            <button class="btn-action" onclick="toggleDecoy('${camp.id}', this)" id="btnToggleDecoy-${camp.id}">
              ⚡ Bypass Decoy
            </button>
            <button class="btn-action" style="background:rgba(6,182,212,0.18); border-color:var(--cyan); color:#67e8f9; font-weight:700;" onclick="toggleStrikesDrawer('${camp.id}', this)" id="btnViewStrikes-${camp.id}">
              📅 View All Strikes
            </button>
            <button class="btn-action" onclick="downloadCampaignIcs('${camp.id}', this)">
              📥 Download .ICS
            </button>
            <a class="btn-action" href="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent('webcal://' + new URL(CLOUDFLARE_WORKER_URL).host + '/cal/' + camp.id + '.ics')}" target="_blank">
              📱 QR Code
            </a>
            <button class="btn-action" onclick="copyDashboardUrl('${camp.id}', this)">
              🔗 Link
            </button>
            <button class="btn-action btn-kill" onclick="engageKillSwitch('${camp.id}', this)">
              🚨 Kill Switch
            </button>
            <button class="btn-action" style="color:#f87171; border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.06);" onclick="untrackCampaign('${camp.id}')" title="Remove from your dashboard">
              🗑️ Untrack
            </button>
          </div>

          <!-- Expandable Invite & Trojan Cover Story Dispatcher Drawer -->
          <div id="inviteDrawer-${camp.id}" style="display:none; margin-top:14px; background:rgba(15,23,42,0.92); border:1px solid rgba(59,130,246,0.45); border-radius:14px; padding:18px; box-shadow:0 12px 30px rgba(0,0,0,0.6);">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
              <div>
                <div style="font-size:0.95rem; font-weight:800; color:#60a5fa; display:flex; align-items:center; gap:6px;">
                  <span>✉️ Trojan Invite & Cover Story Dispatcher</span>
                  <span style="font-size:0.68rem; background:rgba(37,99,235,0.25); color:#93c5fd; padding:2px 8px; border-radius:999px;">Multi-Target Versatile</span>
                </div>
                <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">
                  Prank multiple people with the same calendar! Choose a cover story, customize the decoy event, and copy pre-written SMS scripts.
                </div>
              </div>
              <button type="button" onclick="toggleInviteDrawer('${camp.id}')" style="background:transparent; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer; line-height:1;">&times;</button>
            </div>

            <!-- Cover Story Selector Pills -->
            <div style="margin-bottom:14px;">
              <div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; color:#94a3b8; letter-spacing:0.05em; margin-bottom:6px;">
                1. Select Cover Story Theme:
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px;" id="themePills-${camp.id}">
                <button type="button" class="theme-pill active" onclick="selectInviteTheme('${camp.id}', 'event', this)">💌 Event Invite</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'shared', this)">📅 Shared Calendar</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'trip', this)">✈️ Trip Itinerary</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'delivery', this)">📦 Delivery Tracking</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'directory', this)">📱 Mobile IT Sync</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'trash', this)">🗑️ City Services</button>
                <button type="button" class="theme-pill" onclick="selectInviteTheme('${camp.id}', 'custom', this)">✍️ Custom Story</button>
              </div>
            </div>

    async function fetchCampaignDetailsForCountdown(cid, targetEl) {
      try {
        const cleanUrl = CLOUDFLARE_WORKER_URL.replace(/\/+$/, "");
        let details = CAMPAIGN_EVENTS_CACHE[cid];
        if (!details) {
          const res = await fetch(`${cleanUrl}/api/campaigns/${cid}`);
          if (res.ok) {
            details = await res.json();
            CAMPAIGN_EVENTS_CACHE[cid] = details;
          }
        }
        if (!details || !details.events || !details.events.length) {
          targetEl.textContent = "None Scheduled";
          return;
        }

        const now = Date.now();
        const upcoming = details.events
          .map(e => ({ ...e, time: new Date(e.dateObj || now).getTime() }))
          .filter(e => e.time >= now - 86400000)
          .sort((a, b) => a.time - b.time);

        if (upcoming.length > 0) {
          const next = upcoming[0];
          const diffDays = Math.max(0, Math.round((next.time - now) / 86400000));
          const timeLabel = diffDays === 0 ? "Today" : (diffDays === 1 ? "Tomorrow" : `in ${diffDays}d`);
          targetEl.textContent = `${timeLabel} (${next.dateStr.split(",")[0] || 'Soon'})`;
          targetEl.title = next.title;
          targetEl.style.color = "#34d399";
        } else {
          targetEl.textContent = "Completed";
        }
      } catch (e) {
        targetEl.textContent = "Active";
      }
    }

    function formatHoursAgo(hours) {
      if (hours === null || hours === undefined || !isFinite(hours)) {
        return "recently";
      }
      if (hours < 1) {
        const mins = Math.max(1, Math.round(hours * 60));
        return `${mins}m ago`;
      }
      if (hours < 24) {
        return `${Math.round(hours)}h ago`;
      }
      const days = Math.round(hours / 24);
      return `${days}d ago`;
    }

      const listEl = document.getElementById(`strikeDrawerList-${cid}`);

      const cleanUrl = CLOUDFLARE_WORKER_URL.replace(/\/+$/, "");

      try {

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        CAMPAIGN_EVENTS_CACHE[cid] = data;
        renderDrawerStrikes(cid, data);
      } catch (err) {
        if (listEl) {
          listEl.innerHTML = `<div style="text-align:center; padding:16px; color:#f87171; font-size:0.8rem;">Could not load strikes from edge: ${err.message}</div>`;

    function renderDrawerStrikes(cid, data, searchQuery = "") {
      const listEl = document.getElementById(`strikeDrawerList-${cid}`);
      const countBadge = document.getElementById(`strikeDrawerCount-${cid}`);
      if (!listEl) return;

      const events = data.events || [];
      const dripDays = data.dripDays !== undefined ? Number(data.dripDays) : 14;
      const isDecoy = Boolean(data.isDecoy);
      const now = Date.now();
      const maxFutureTime = dripDays > 0 ? now + (dripDays * 86400 * 1000) : Infinity;

      const q = (searchQuery || "").toLowerCase().trim();
      const filtered = events.filter(ev => {
        if (!q) return true;
        return (ev.title || "").toLowerCase().includes(q) ||
               (ev.memo || "").toLowerCase().includes(q) ||
               (ev.dateStr || "").toLowerCase().includes(q) ||
               (ev.category || "").toLowerCase().includes(q);
      });

      if (countBadge) {
        countBadge.textContent = `${events.length} Total Strikes`;
      }

      if (!filtered.length) {
        listEl.innerHTML = `<div style="text-align:center; padding:18px; color:#94a3b8; font-size:0.8rem;">No strikes match "${searchQuery}".</div>`;

    async function downloadCampaignIcs(cid, btnEl) {
      const oldText = btnEl.textContent;
      btnEl.textContent = "⏳ Downloading...";
      btnEl.disabled = true;

      try {
        const url = `https://${new URL(CLOUDFLARE_WORKER_URL).host}/cal/${cid}.ics?all=1`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch calendar file");
        const blob = await res.blob();
        const dlUrl = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = dlUrl;
        a.download = `phantomsync-${cid}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(dlUrl);
        btnEl.textContent = "✓ Downloaded!";
      } catch (e) {
        alert("Download error: " + e.message);
        btnEl.textContent = oldText;
      } finally {
        btnEl.disabled = false;
        setTimeout(() => { btnEl.textContent = oldText; }, 2000);
      }
    }

      // Save to untracked blacklist so it is not auto-seeded again
      try {
        const untracked = JSON.parse(localStorage.getItem("phantom_untracked") || "[]");
        if (!untracked.includes(cid)) {
          untracked.push(cid);
          localStorage.setItem("phantom_untracked", JSON.stringify(untracked));
        }
      } catch (e) {}

      renderDashboard();

    // Track manually (Supports ps_..., c_demo_victim_0, or typing "Jared")
    async function trackEnteredCampaign() {
      const input = document.getElementById("inputTrackCid").value.trim();
      if (!input) return;

      let fullCid = input;
      let defaultName = "Target";

      if (input.toLowerCase().includes("jared") || input.toLowerCase().includes("victim 0") || input.toLowerCase().includes("victim_0")) {
        fullCid = "c_demo_victim_0";
        defaultName = "Jared Wilson (Victim 0)";
      } else {
        const match = input.match(/(?:ps_|c_)[a-zA-Z0-9_-]+/i);
        const clean = input.replace(/^(?:ps_|c_)/, "");
        fullCid = match ? match[0] : (clean.startsWith("ps_") || clean.startsWith("c_") ? clean : `ps_${clean}`);
        if (fullCid === "c_demo_victim_0") defaultName = "Jared Wilson (Victim 0)";
      }

      // If re-tracking, remove from untracked blacklist
      try {
        let untracked = JSON.parse(localStorage.getItem("phantom_untracked") || "[]");
        untracked = untracked.filter(id => id !== fullCid);
        localStorage.setItem("phantom_untracked", JSON.stringify(untracked));
      } catch (e) {}

      const camps = getStoredCampaigns();
      let camp = camps.find(c => c.id === fullCid);
      if (!camp) {
        camp = { id: fullCid, name: defaultName, createdAt: Date.now() };
        camps.unshift(camp);
        saveStoredCampaigns(camps);
      }
      document.getElementById("inputTrackCid").value = "";
      renderDashboard();

      // Background fetch real target name from edge API
      try {
        const status = await fetchCampaignStatus(fullCid);
        if (status && status.name && status.name !== "Target") {
          camp.name = status.name;
          saveStoredCampaigns(camps);
          renderDashboard();
        }
      } catch (e) {}
    }

        e.preventDefault();
        trackEnteredCampaign();
      }
    });

    async function saveDrawerStrikeModal() {
      const cid = document.getElementById("drawerModalCid").value;
      const idx = parseInt(document.getElementById("drawerModalIndex").value, 10);
      const dateVal = document.getElementById("drawerModalDate").value;
      const titleVal = document.getElementById("drawerModalStrikeTitle").value.trim();
      const memoVal = document.getElementById("drawerModalMemo").value.trim();
      const catVal = document.getElementById("drawerModalCategory").value;
      const isPersonal = document.getElementById("drawerModalIsPersonal").value === "1";
      const alarmVal = document.getElementById("drawerModalAlarm").value;
      const saveBtn = document.getElementById("btnDrawerSaveStrike");

      if (!titleVal) {
        alert("Please enter a strike title.");
        return;
      }
      if (!dateVal) {
        alert("Please select a date for this strike.");
        return;
      }

      const parts = dateVal.split("-");
      const dateObj = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
      const dateStr = dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

      const campData = CAMPAIGN_EVENTS_CACHE[cid] || { events: [] };
      campData.events = campData.events || [];

      if (idx >= 0 && idx < campData.events.length) {
        // Edit existing strike
        const ev = campData.events[idx];
        ev.title = titleVal;
        ev.memo = memoVal;
        ev.category = catVal;
        ev.dateObj = dateObj.toISOString();
        ev.dateStr = dateStr;
        ev.isPersonal = isPersonal;
        ev.alarmTime = alarmVal;
      } else {
        // Add new strike
        const newId = `ev_custom_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        campData.events.push({
          id: newId,
          uid: `phantom-${cid}-${newId}@phantomsync.io`,
          title: titleVal,
          memo: memoVal,
          category: catVal,
          dateObj: dateObj.toISOString(),
          dateStr: dateStr,
          isPersonal: isPersonal,
          alarmTime: alarmVal,
          gap: 4
        });
      }

      // Sort events chronologically
      campData.events.sort((a, b) => new Date(a.dateObj).getTime() - new Date(b.dateObj).getTime());

      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "⏳ Saving to Phone Feed...";
      }

      try {
        const cleanUrl = CLOUDFLARE_WORKER_URL.replace(/\/+$/, "");
        const res = await fetch(`${cleanUrl}/api/campaigns/${cid}/events`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: campData.events })
        });
        if (!res.ok) {
          console.warn("Worker response error:", res.status);
        }
      } catch (err) {
        console.warn("Error posting events to worker:", err);
      } finally {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = "💾 Save & Sync to Phone";
        }
      }

      closeDrawerStrikeModal();
      renderDrawerStrikes(cid, campData, document.getElementById(`strikeDrawerSearch-${cid}`)?.value || "");
      updateCardTelemetry(cid);
    }

    async function deleteDrawerStrike(cid, idx) {
      const campData = CAMPAIGN_EVENTS_CACHE[cid];
      if (!campData || !campData.events || idx < 0 || idx >= campData.events.length) return;
      const ev = campData.events[idx];
      if (!confirm(`Delete strike "${ev.title}"?\n\nThis strike will be removed from the target's phone calendar on next sync.`)) return;

      campData.events.splice(idx, 1);

      try {
        const cleanUrl = CLOUDFLARE_WORKER_URL.replace(/\/+$/, "");
        await fetch(`${cleanUrl}/api/campaigns/${cid}/events`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events: campData.events })
        });
      } catch (err) {
        console.warn("Error deleting event from worker:", err);
      }

      renderDrawerStrikes(cid, campData, document.getElementById(`strikeDrawerSearch-${cid}`)?.value || "");
      updateCardTelemetry(cid);
    }

  </script>

  <div id="drawerStrikeModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:9999; justify-content:center; align-items:center; padding:16px;">
    <div style="background:#0f172a; border:1px solid rgba(56,189,248,0.3); border-radius:16px; max-width:540px; width:100%; padding:20px 24px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.7); max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:10px;">
        <h3 id="drawerModalTitle" style="margin:0; font-size:1.05rem; font-weight:800; color:#38bdf8;">✏️ Edit Scheduled Strike</h3>
        <button type="button" onclick="closeDrawerStrikeModal()" style="background:none; border:none; color:#94a3b8; font-size:1.2rem; cursor:pointer; padding:4px;">✕</button>
      </div>

      <input type="hidden" id="drawerModalCid" value="">
      <input type="hidden" id="drawerModalIndex" value="-1">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
        <div>
          <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Strike Date</label>
          <input type="date" id="drawerModalDate" style="width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:white; padding:8px 10px; border-radius:8px; font-size:0.85rem;">
        </div>
        <div>
          <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Push Alarm Trigger</label>
          <select id="drawerModalAlarm" style="width:100%; box-sizing:border-box; background:#1e293b; border:1px solid rgba(255,255,255,0.15); color:white; padding:8px 10px; border-radius:8px; font-size:0.85rem;">
            <option value="09:00">Morning Commute (9:00 AM)</option>
            <option value="13:15">Workday Lunch Panic (1:15 PM)</option>
            <option value="02:30">Late-Night Chaos (2:30 AM)</option>
            <option value="03:14">Midnight Existential (3:14 AM)</option>
            <option value="silent">Silent Stealth (No Alarm)</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Strike Title</label>
        <input type="text" id="drawerModalStrikeTitle" placeholder="e.g. 🥛 Inspection of Empty 2% Milk Carton Left in Fridge" style="width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:white; padding:9px 12px; border-radius:8px; font-size:0.88rem; font-weight:600;">
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Official Citation Memo / Subtext</label>
        <textarea id="drawerModalMemo" rows="3" placeholder="e.g. Resource Management: Exactly 0.04oz of liquid preserved in plastic jug to avoid replacement duty." style="width:100%; box-sizing:border-box; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:white; padding:9px 12px; border-radius:8px; font-size:0.82rem; font-family:inherit; resize:vertical;"></textarea>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
        <div>
          <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Institutional Category</label>
          <select id="drawerModalCategory" style="width:100%; box-sizing:border-box; background:#1e293b; border:1px solid rgba(255,255,255,0.15); color:white; padding:8px 10px; border-radius:8px; font-size:0.85rem;">
            <option value="Municipal Citation">🏛️ Municipal Citation</option>
            <option value="Sanitary Protocol">☣️ Sanitary Protocol</option>
            <option value="IoT Disciplinary">🤖 IoT Disciplinary</option>
            <option value="Financial Audit">📊 Financial Audit</option>
            <option value="Telecom Etiquette">📱 Telecom Etiquette</option>
            <option value="Surveillance Directive">🔍 Surveillance Directive</option>
            <option value="Domestic Review">🥛 Domestic Review</option>
            <option value="Corporate Audit">💼 Corporate Audit</option>
            <option value="Automotive Transit">🚗 Automotive Transit</option>
            <option value="Social Oversight">👀 Social Oversight</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:0.75rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">Strike Type</label>
          <select id="drawerModalIsPersonal" style="width:100%; box-sizing:border-box; background:#1e293b; border:1px solid rgba(255,255,255,0.15); color:white; padding:8px 10px; border-radius:8px; font-size:0.85rem;">
            <option value="1">🎯 Personal Dossier Strike</option>
            <option value="0">🏛️ General Institutional Incident</option>
          </select>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn-action" style="padding:7px 14px; font-size:0.8rem;" onclick="closeDrawerStrikeModal()">Cancel</button>
        <button type="button" id="btnDrawerSaveStrike" class="btn-primary" style="padding:7px 18px; font-size:0.82rem; background:linear-gradient(135deg, #0ea5e9, #0284c7); border:none; color:white; border-radius:8px; font-weight:800; cursor:pointer;" onclick="saveDrawerStrikeModal()">
          💾 Save &amp; Sync to Phone
        </button>
      </div>
    </div>
  </div>

</body>
</html>
